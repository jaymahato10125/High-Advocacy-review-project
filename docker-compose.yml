services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: proofdesk
      MYSQL_DATABASE: proof_desk
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pproofdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
  adminer:
    image: adminer
    ports: ["8080:8080"]
volumes:
  mysql_data:
